plugins {
    id 'com.android.application'
}

android {
    namespace 'com.monkeyart.app'
    compileSdk 23

    defaultConfig {
        applicationId "com.monkeyart.app"
        minSdk 14
        targetSdk 23
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.3.1'
}
